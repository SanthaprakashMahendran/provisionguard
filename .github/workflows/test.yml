name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one Python version failing shouldn't cancel the other
      matrix:
        include:
          # Oldest supported Python; newer runner images (Ubuntu 26.04+) no longer offer 3.9.
          - python-version: "3.9"
            os: ubuntu-24.04
          # The version the action itself runs on.
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover tests
