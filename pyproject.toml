[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "provisionguard"
version = "1.0.0"
description = "Pre-merge review of Terraform pull requests: security, existing infrastructure, quotas, right-sizing, tagging, cost and an architecture diagram."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["boto3>=1.36", "pyyaml>=6.0"]

[project.scripts]
provisionguard = "provisionguard.main:main"

[tool.setuptools]
packages = ["provisionguard"]

[tool.setuptools.package-data]
provisionguard = ["policies/*.yaml"]
